services:
  rallybit:
    build:
      context: ..
      dockerfile: bot-js/Dockerfile
      target: runtime
    image: rallybit-discordjs:local
    container_name: rallybit
    restart: unless-stopped
    stop_grace_period: 25s
    init: true
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777
    env_file:
      - ../rallybitbot/.env
    environment:
      RALLYBIT_DATA_DIR: /data
      API_HOST: 0.0.0.0
      API_PORT: 8080
      RALLYBIT_JS_CUTOVER_APPROVED: verified
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../rallybitbot/data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
